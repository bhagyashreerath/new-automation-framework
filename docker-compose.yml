version: "3.9"

services:
  selenium-hub:
    image: selenium/hub:4.18.1
    container_name: selenium-hub
    ports:
      - "4444:4444"
    networks:
      - selenium-grid

  chrome:
    image: selenium/node-chrome:4.18.1
    container_name: chrome-node
    shm_size: 2gb
    depends_on:
      - selenium-hub
    environment:
      - SE_EVENT_BUS_HOST=selenium-hub
      - SE_EVENT_BUS_PUBLISH_PORT=4442
      - SE_EVENT_BUS_SUBSCRIBE_PORT=4443
      - SE_NODE_MAX_SESSIONS=2
    networks:
      - selenium-grid

  firefox:
    image: selenium/node-firefox:4.18.1
    container_name: firefox-node
    shm_size: 2gb
    depends_on:
      - selenium-hub
    environment:
      - SE_EVENT_BUS_HOST=selenium-hub
      - SE_EVENT_BUS_PUBLISH_PORT=4442
      - SE_EVENT_BUS_SUBSCRIBE_PORT=4443
    networks:
      - selenium-grid

  chrome-video:
    image: selenium/video:ffmpeg-4.3.1-20240207
    container_name: chrome-video
    depends_on:
      - chrome
    volumes:
      - ./videos:/videos
    environment:
      - DISPLAY_CONTAINER_NAME=chrome-node
      - FILE_NAME=chrome-session.mp4
    networks:
      - selenium-grid

  firefox-video:
    image: selenium/video:ffmpeg-4.3.1-20240207
    container_name: firefox-video
    depends_on:
      - firefox
    volumes:
      - ./videos:/videos
    environment:
      - DISPLAY_CONTAINER_NAME=firefox-node
      - FILE_NAME=firefox-session.mp4
    networks:
      - selenium-grid

networks:
  selenium-grid:
    driver: bridge
